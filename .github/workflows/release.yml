name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

# Manual only. Creating a tag does not build anything -- a release happens when
# someone asks for one.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0). Leave empty to build the ref picked in "Use workflow from".'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-latest
            target: darwin-x64
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      # A tag can arrive two ways: typed into the input, or picked in the
      # "Use workflow from" dropdown. The input wins so the workflow definition
      # can come from master while the code being built comes from the tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun test

      # Tailwind's output is an INPUT to the bundle (index.html links it), so it has to exist
      # before build.ts runs. build.ts fails loudly if it does not, but generating it here
      # keeps that gate as a backstop rather than the mechanism.
      - run: bun run build:css

      - run: bun run build.ts --target=${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.target == 'windows-x64'
        shell: bash
        run: 7z a "dist/bunview-${{ matrix.target }}.zip" "./dist/bunview-${{ matrix.target }}.exe"

      - name: Package (macOS)
        if: startsWith(matrix.target, 'darwin-')
        run: |
          cd dist
          # Zip the .app bundle rather than the bare binary: Gatekeeper checks the bundle's
          # signature, and a loose executable is blocked on download.
          if [ -d "BunView-macos.app" ]; then
            zip -r "bunview-${{ matrix.target }}.zip" "BunView-macos.app"
          else
            zip "bunview-${{ matrix.target }}.zip" "bunview-${{ matrix.target }}"
          fi

      - name: Package (Linux)
        if: startsWith(matrix.target, 'linux-')
        run: |
          cd dist
          # The .png travels with the .desktop file: `Icon=` points at it by absolute path,
          # which is the only file-based form the Desktop Entry spec accepts.
          zip "bunview-${{ matrix.target }}.zip" \
            "bunview-${{ matrix.target }}" \
            "bunview-${{ matrix.target }}.desktop" \
            "bunview-${{ matrix.target }}.png"

      - uses: actions/upload-artifact@v4
        with:
          name: bunview-${{ matrix.target }}
          path: dist/bunview-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    needs: build
    # No tag means no release to attach binaries to, so a run launched from a
    # branch just leaves the per-target zips on the run as artifacts.
    if: inputs.tag != '' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # Draft, so the release notes and the binaries can be checked before anyone
          # downloads them.
          draft: true
          files: dist/*.zip
